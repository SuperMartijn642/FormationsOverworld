name: Bug report
title: "[Bug] Your title here"
description: Report of a bug
labels: bug
body:
  - type: input
    id: input-0
    attributes:
      label: Minecraft version
      description: What Minecraft version are you using?
    validations:
      required: true
  - type: dropdown
    id: dropdown-0
    attributes:
      label: Mod Loader
      description: Which mod loader are you using?
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
    validations:
      required: true
  - type: input
    id: input-1
    attributes:
      label: Formations Overworld version
      description: What version of Formations Overworld are you using?
    validations:
      required: true
  - type: input
    id: input-2
    attributes:
      label: Formations version
      description: What version of [Formations](https://www.curseforge.com/minecraft/mc-mods/formations) are you using?
    validations:
      required: true
  - type: textarea
    id: textarea-0
    attributes:
      label: Bug description
      description: Please describe your issue. It is often clearest if you describe
        the current behavior and the expected behavior is.
    validations:
      required: true
  - type: textarea
    id: textarea-1
    attributes:
      label: Steps to reproduce
      description: Please describe the steps needed to recreate the issue. If you
        cannot recreate the issue, please describe what you were doing when the
        issue occurred.
    validations:
      required: true
  - type: textarea
    id: textarea-2
    attributes:
      label: Screenshots
      description: Please share some screenshots of the issue. If screenshots are not
        relevant to your issue, you can omit this section.
